<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low Confidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column of message traffic under a sticky
   EXERCISE banner; a hand-drawn-feeling situation map at the top of each
   day; mono metadata like a cable header, sans body, condensed caps for
   headings; the only flourish is the brief's stamp. */
:root{
  --c-low:#b0281f;--c-low-soft:#f6dcd8;--c-med:#a86a00;--c-med-soft:#f3e3c4;--c-high:#2b7a4b;--c-high-soft:#d7ecdf;
  --paper:#e6eae8;
  --card:#f6f7f5;
  --ink:#151a1e;
  --muted:#56616a;
  --line:#c5ccc9;
  --accent:#9a5d00;
  --accent-soft:#f1e2c6;
  --banner:#3d6a4a;
  --banner-ink:#f2f6f2;
  --good:#2b7a4b;
  --bad:#b0281f;
  --warn:#a86a00;
  --stamp:#b0281f;
  --m-land:#efeadc;
  --m-elsin:#e4e7d8;
  --m-water:#5b8fb0;
  --m-forest:#a9bf98;
  --m-ink:#3a4148;
  --friendly:#2f62a8;
  --hostile:#b0281f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101417;--card:#181e22;--ink:#e3e8e6;--muted:#93a0a8;--line:#2b353b;
    --accent:#e2a33c;--accent-soft:#3a2d16;--banner:#2c5537;--banner-ink:#e6f0e8;
    --good:#5cbf84;--bad:#ec6a5e;--warn:#e2a33c;--stamp:#ec6a5e;
    --m-land:#232823;--m-elsin:#1e2420;--m-water:#5f93b5;--m-forest:#3c5236;--m-ink:#c9d0cc;
    --friendly:#6f9be0;--hostile:#ec6a5e;color-scheme:dark;
    --c-low:#ec6a5e;--c-low-soft:#3a1f1c;--c-med:#e2a33c;--c-med-soft:#3a2d16;--c-high:#5cbf84;--c-high-soft:#1d3326;
  }
}
:root[data-theme="dark"]{
  --paper:#101417;--card:#181e22;--ink:#e3e8e6;--muted:#93a0a8;--line:#2b353b;
  --accent:#e2a33c;--accent-soft:#3a2d16;--banner:#2c5537;--banner-ink:#e6f0e8;
  --good:#5cbf84;--bad:#ec6a5e;--warn:#e2a33c;--stamp:#ec6a5e;
  --m-land:#232823;--m-elsin:#1e2420;--m-water:#5f93b5;--m-forest:#3c5236;--m-ink:#c9d0cc;
  --friendly:#6f9be0;--hostile:#ec6a5e;color-scheme:dark;
  --c-low:#ec6a5e;--c-low-soft:#3a1f1c;--c-med:#e2a33c;--c-med-soft:#3a2d16;--c-high:#5cbf84;--c-high-soft:#1d3326;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{position:sticky;top:0;z-index:5;background:var(--banner);color:var(--banner-ink);font:600 11px/1 var(--f-mono);letter-spacing:.18em;text-align:center;padding:5px 8px;text-transform:uppercase}
.banner.bottom{position:static;margin-top:32px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{display:grid;gap:2px;padding:16px 0 10px}
.eyebrow{font:500 12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px;text-transform:uppercase}
.status-line{display:flex;flex-wrap:wrap;gap:6px 14px;font:12px/1.4 var(--f-mono);color:var(--muted)}
.status-line b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);position:sticky;top:21px;background:var(--paper);z-index:4;padding-top:6px}
.tab{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 3px 8px;font:600 13px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;min-width:16px;margin-left:3px;padding:2px 4px;border-radius:9px;background:var(--accent-soft);color:var(--ink);font:600 11px/1 var(--f-mono)}
main{display:grid;gap:14px;padding:16px 0 8px}
.stack{display:grid;gap:12px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:10px}
.card.flagged{border-left:4px solid var(--warn)}
.card.nr{opacity:.72}
.card.hl{box-shadow:0 0 0 2px var(--accent)}
.cable-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font:500 12.5px/1.3 var(--f-mono);color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px}
.cable-h .rid{color:var(--ink);font-weight:600}
.cable-h .src{color:var(--ink)}
.cable-h .recv{margin-left:auto;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
.cable-t{font-size:16px;line-height:1.55}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:3px;font:500 13px/1 var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.flag[aria-pressed="true"]{border-color:var(--warn)}
.board{display:grid;gap:0;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.brow{display:grid;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow.dim .bitem{opacity:.55}
.bhead,.bfoot{padding-top:6px;padding-bottom:6px}
.bfoot{background:var(--paper)}
.bitem{display:grid;gap:3px;min-width:0}
.btext{font-size:13px;line-height:1.35}
.btags{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bh,.bt{text-align:center;font:600 13px/1 var(--f-mono)}
.bt.lead{color:var(--c-high)}
.bt.lead::after{content:" \2713"}
.bcell{width:44px;height:44px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font:700 16px/1 var(--f-mono);color:var(--muted);cursor:pointer}
.bcell.m-c{background:var(--c-high-soft);border-color:var(--c-high);color:var(--ink)}
.bcell.m-i{background:var(--c-low-soft);border-color:var(--c-low);color:var(--ink)}
.bcell.m-n{color:var(--ink)}
.bcell:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}
.legend b{color:var(--ink);font-family:var(--f-mono)}
.anote{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:14px;color:var(--muted);font-style:italic}
.anote .who{display:block;font:500 11.5px/1.4 var(--f-mono);font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.msg.notes{border-left-color:var(--line)}
.msg.posting{border-left-color:var(--c-low)}
.crednote{color:var(--ink)}
.status-line b.cred-questioned,.cred-questioned{color:var(--c-med)}
.status-line b.cred-discounted,.cred-discounted{color:var(--c-low)}
.meter span.cut{background:none;outline:1px dashed var(--muted);outline-offset:-1px}
.nudge{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:14px}
.linkbtn.menulink{justify-self:start;text-decoration:none;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.gametitle{font-size:clamp(40px,13vw,56px);line-height:.95}
.menu-top{padding-top:28px;gap:10px}
.menu{margin-top:18px}
.btn.big{display:grid;gap:4px;text-align:left;width:100%;padding:16px 16px}
.btn.big small{font:500 12px/1.3 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.opt.scen{width:100%;background:var(--card);cursor:pointer}
.opt.scen.locked{opacity:.6;border-style:dashed}
.opt.scen .d b{color:var(--ink);font-weight:500;font-family:var(--f-mono);font-size:12.5px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:600 13px/1.2 var(--f-body);text-decoration:underline;cursor:pointer;min-height:32px}
.yourgrade{font:12.5px/1.4 var(--f-mono);color:var(--muted)}
.yourgrade b{color:var(--ink)}
.msg,.readin{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--banner);border-radius:4px;padding:12px 14px;display:grid;gap:6px}
.readin{border-left-color:var(--ink)}
.from{font:500 12px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.msg q{font-style:italic;quotes:"\201C" "\201D"}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:2px;font:13px/1.45 var(--f-mono);color:var(--muted)}
.facts li::before{content:"\25B8 ";color:var(--ink)}
.note{font-size:14px;border-top:1px dashed var(--line);padding-top:6px;color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
details{border:1px solid var(--line);border-radius:4px;background:var(--card)}
details>summary{cursor:pointer;padding:10px 14px;font:600 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.06em;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open]>summary::after{content:"\2212"}
details .inner{padding:0 14px 14px;display:grid;gap:10px}
details .card{background:var(--paper)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font:600 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;padding:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer}
.opt .k{font:600 15px/1.4 var(--f-mono);grid-row:span 2}
.opt .t{font-weight:600}
.opt .d{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.confs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.conf{padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;display:grid;gap:2px;text-align:center}
.conf b{font:600 16px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.conf span{font-size:12.5px;color:var(--muted)}
.conf[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.conf.c-low b{color:var(--c-low)}.conf.c-medium b{color:var(--c-med)}.conf.c-high b{color:var(--c-high)}
.conf.c-low[aria-pressed="true"]{border-color:var(--c-low);box-shadow:inset 0 0 0 2px var(--c-low);background:var(--c-low-soft)}
.conf.c-medium[aria-pressed="true"]{border-color:var(--c-med);box-shadow:inset 0 0 0 2px var(--c-med);background:var(--c-med-soft)}
.conf.c-high[aria-pressed="true"]{border-color:var(--c-high);box-shadow:inset 0 0 0 2px var(--c-high);background:var(--c-high-soft)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cdot.c-low{background:var(--c-low)}.cdot.c-medium{background:var(--c-med)}.cdot.c-high{background:var(--c-high)}
.predict{font-size:14.5px;padding:10px 12px;border:1px dashed var(--line);border-radius:4px}
.predict b{font-weight:600}
.evi{display:grid;grid-template-columns:76px 1fr;gap:8px;text-align:left;padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;font-size:14px}
.evi .id{font:600 12.5px/1.5 var(--f-mono)}
.evi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.evi:disabled{opacity:.45;cursor:not-allowed}
.evigroup{display:grid;gap:6px}
.evigroup h4{margin:6px 0 0;font:600 12px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;min-height:72px;font:15px/1.45 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px}
label.lab{font:600 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn{min-height:48px;padding:0 18px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:600 17px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.stamp{justify-self:start;display:inline-grid;gap:2px;border:3px double var(--stamp);color:var(--stamp);padding:6px 12px;transform:rotate(-2.5deg);font:700 18px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.stamp small{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em}
.record{display:grid;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 7px;border-radius:3px;font:600 11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;border:1px solid currentColor}
.k-true{color:var(--good)}
.k-planted{color:var(--bad)}
.k-noise,.k-clutter{color:var(--muted)}
.right{color:var(--good);font-weight:600}
.wrong{color:var(--bad);font-weight:600}
.ending{border:1px solid var(--line);border-top:5px solid var(--ink);background:var(--card);border-radius:4px;padding:14px;display:grid;gap:8px}
.ending.good{border-top-color:var(--good)}
.ending.warn{border-top-color:var(--warn)}
.ending.bad{border-top-color:var(--bad)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .n{font:700 52px/1 var(--f-display);font-variant-numeric:tabular-nums}
.reveal{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.reveal .head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font:12.5px/1.4 var(--f-mono)}
.reveal .txt{font-size:14px;color:var(--muted)}
.reveal .what{font-size:15px}
.tells{font-size:13.5px;color:var(--muted)}
.why{display:grid;gap:8px;border-left:3px solid var(--bad);padding-left:10px}
.why p{font-size:15px}
.whyk{display:block;font:600 11.5px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.caught{color:var(--good);font:600 12px/1 var(--f-mono)}
.missed{color:var(--bad);font:600 12px/1 var(--f-mono)}
ul{margin:0;padding-left:20px;display:grid;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.55);display:grid;place-items:end center;z-index:10;padding:16px}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:4px;font-size:14px;z-index:11;max-width:90vw}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch button{min-width:64px;min-height:36px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font:600 13px/1 var(--f-mono);cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.loading{padding:40px 0;font-family:var(--f-mono);color:var(--muted)}
.kj{font-size:15px;font-style:italic;border-left:3px solid var(--ink);padding-left:10px}
.msg.pt{border-left-color:var(--accent)}
.msg.tip{border-left-color:var(--accent);background:var(--accent-soft)}
.meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(20px,1fr));gap:4px}
.meter span{height:8px;border-radius:2px;background:var(--line)}
.meter span.on{background:var(--accent)}
.card.pir{gap:8px}
.trow{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.tname{font-weight:600;font-size:15px}
.chip.task{font:600 12.5px/1 var(--f-mono)}
.chip.task:disabled{opacity:.4;cursor:not-allowed}
.pill.tasked{color:var(--friendly)}
.m-task{fill:none;stroke:var(--friendly);stroke-width:2;stroke-dasharray:4 3}
.dq{display:grid;gap:6px}
textarea.short{min-height:48px}
.chip.rflag[aria-pressed="true"]{border-color:var(--bad)}
pre.log{white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0;overflow-x:auto}
/* Map */
.map{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px;display:grid;gap:6px}
.map svg{display:block;width:100%;height:auto;border-radius:2px}
.m-land{fill:var(--m-land)}
.m-elsin{fill:var(--m-elsin)}
.m-hill{fill:none;stroke:var(--m-ink);stroke-opacity:.22;stroke-width:1}
.m-forest{fill:var(--m-forest);stroke:var(--m-ink);stroke-opacity:.25}
.m-train{fill:url(#hatch);stroke:var(--m-ink);stroke-opacity:.45;stroke-dasharray:4 3}
.m-hatch{stroke:var(--m-ink);stroke-opacity:.25;stroke-width:1.2}
.m-river{fill:none;stroke:var(--m-water);stroke-width:4;stroke-linecap:round}
.m-res{fill:var(--m-water);fill-opacity:.85}
.m-area{fill:var(--card);stroke:var(--m-ink);stroke-width:1.6;stroke-dasharray:9 4 2 4}
.m-zone{fill:var(--card);fill-opacity:.55;stroke:var(--m-ink);stroke-opacity:.5;stroke-width:1;stroke-dasharray:3 3}
.m-zonelab{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;fill:var(--m-ink)}
.m-pipe{fill:none;stroke:var(--m-ink);stroke-width:2.5;stroke-dasharray:1 5;stroke-linecap:round}
.m-border{fill:none;stroke:var(--m-ink);stroke-width:1.6;stroke-dasharray:9 4 2 4}
.m-place{fill:var(--card);stroke:var(--m-ink);stroke-width:1.5}
.m-dam{stroke:var(--m-ink);stroke-width:4;stroke-linecap:square}
.m-lab{font:500 10.5px/1 var(--f-mono);fill:var(--m-ink)}
.m-region{font:700 22px/1 var(--f-display);letter-spacing:.35em;fill:var(--m-ink);fill-opacity:.28}
.m-rivlab{font:italic 500 11px/1 var(--f-body);fill:var(--m-water)}
.m-off{font:500 10px/1 var(--f-mono);fill:var(--muted)}
.m-scale{stroke:var(--m-ink);stroke-width:2}
.m-fr rect{fill:var(--card);stroke:var(--friendly);stroke-width:2}
.m-fr line{stroke:var(--friendly);stroke-width:1.4}
.m-fr text{font:600 9.5px/1 var(--f-mono);fill:var(--friendly)}
.m-hu path{fill:var(--card);stroke:var(--hostile);stroke-width:2}
.m-hu text{font:600 9.5px/1 var(--f-mono);fill:var(--hostile)}
.m-pin{cursor:pointer}
.m-pin circle.dot{fill:var(--card);stroke:var(--m-ink);stroke-width:1.6}

<body>
<div class="banner" aria-hidden="true">Exercise · Exercise · Exercise</div>
<div class="wrap"><div id="app"><p class="loading">Loading the crisis file…</p></div></div>
<div class="banner bottom" aria-hidden="true">Exercise · Exercise · Exercise</div>
<div id="layer"></div>
<script>
(function(){
'use strict';

/* ---------- Engine constants (doctrine, not crisis content) ---------- */
const CRISIS_URL = 'crises/border-buildup.json';
const INDEX_URL = 'crises/index.json';
let INDEX = [], CUR = null;
const LS_PREFIX = 'intel-cell-sim:';
const SOURCE_SCALE = {A:'Completely reliable',B:'Usually reliable',C:'Fairly reliable',D:'Not usually reliable',E:'Unreliable',F:'Reliability cannot be judged'};
const INFO_SCALE = {1:'Confirmed by other sources',2:'Probably true',3:'Possibly true',4:'Doubtful',5:'Improbable',6:'Truth cannot be judged'};
// Confidence: the player chooses this with the hypothesis; evidence affects points only.
const CONF = [
  {id:'low', label:'Low'},
  {id:'medium', label:'Medium'},
  {id:'high', label:'High'}
];

const KIND_LABEL = {'true':'True','noise':'Noise','planted':'Planted','clutter':'Clutter'};
const IDLE_MS = 120000, TICK_MS = 15000;
const CONFIG_URL = 'config.json';
const REACTIONS = [['engaging','Engaging'],['fine','Fine'],['slog','A slog']];
const DEBRIEF = [
  {id:'sixth', q:'Would you have wanted another day?', a:[['yes','Yes'],['no','No'],['unsure','Not sure']]},
  {id:'fair', q:'The planted items were…', a:[['easy','Too easy'],['fair','Fair'],['hard','Too hard'],['unfair','Unfair']]},
  {id:'realism', q:'Tradecraft realism', a:[['real','Realistic'],['mostly','Mostly'],['places','Off in places'],['off','Off']]},
  {id:'pace', q:'Length of a daily turn', a:[['short','Too short'],['right','About right'],['long','Too long']]}
];
let CFG = {playtest:false};

let C = null;          // crisis data
let S = null;          // player state (plain JSON)
const ui = {screen:'menu', tab:'inbox', sheet:null, toast:'', pin:null, pmDay:5, reactDay:null, isOwner:false, pt:{loaded:false, loading:false, docs:[], names:{}, err:''}};
let USER = null, DB = null, ptRef = null, ptRuns = null;
let store = {mode:'local', ref:null, ok:false};
const app = document.getElementById('app');
const layer = document.getElementById('layer');

/* ---------- Helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const rep = id => C.reports.find(r => r.id === id) || fallbackReport((S.collected || []).find(c => c.id === id));
const src = id => C.sources.find(s => s.id === id) || {codeName:id, discipline:''};
const hyp = id => C.hypotheses.find(h => h.id === id);
const confLabel = id => (CONF.find(c => c.id === id) || {}).label || id;
function keyJudgment(b){
  const h = hyp(b.hyp), l = CONF.find(x => x.id === b.conf);
  if (!h || !l) return '';
  return 'We assess with ' + l.label.toLowerCase() + ' confidence that ' + (h.claim || h.text) + (b.evidence.length ? ', based on ' + b.evidence.join(', ') : '') + '.';
}
const callLabel = b => b.hyp + ', ' + confLabel(b.conf) + (b.confLost ? '?' : '');
const burnedOn = sid => (S.burned || {})[sid] || (goneBefore(sid) ? 1 : undefined);
const collectedFor = d => (S.collected || []).filter(c => c.arrive === d).map(c => c.fallback ? fallbackReport(c) : Object.assign({}, C.reports.find(r => r.id === c.id), {day:d, collected:true, task:c}));
const reportsFor = d => C.reports.filter(r => !r.via && r.day === d && condOk(r.when) && !(burnedOn(r.sourceId) && d >= burnedOn(r.sourceId))).concat(collectedFor(d));
const seenReports = () => { const out = []; for (let d = 1; d <= C.days; d++) out.push(...reportsFor(d)); return out; };
const targetById = id => (C.targets || []).find(t => t.id === id) || {name:id};
function fallbackReport(c){
  if (!c) return undefined;
  const sid = tSource(c.disc, c.target);
  const s = C.sources.find(x => x.id === sid) || {startingGrade:'B'};
  return {id:c.id, day:c.arrive, sourceId:sid, discipline:c.disc, sourceGrade:s.startingGrade, credibility:null, text:c.text, kind:'noise', supports:[], contradicts:[], tells:[],
    postmortemNote:c.burn ? c.burnNote : 'A tasking that found nothing. That tells you something too: the place you looked was quiet.', collected:true, fallback:true, task:c};
}
// ---------- collection tasking ----------
const COLL = () => C.collection || null;
const CUST = () => C.customer.short || C.customer.name;
const PRON = () => C.customer.pronouns || ['he', 'his'];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const ADV = () => C.adversary || 'the adversary';
const everAt = st => S.asset === st || (S.moves || []).some(m => m.to === st);
const tgt = id => (C.targets || []).find(t => t.id === id) || {};
const tCost = (disc, tid) => { const v = (tgt(tid).cost || {})[disc]; return v != null ? v : (COLL().costs[disc] || 0); };
const tDelay = (disc, tid) => (tgt(tid).delay || {})[disc] || (COLL().delays || {})[disc] || 1;
const tSource = (disc, tid) => (tgt(tid).source || {})[disc] || (COLL().sources || {})[disc];
function tasksFor(d){ return (S.tasks[d] || []); }
function spentOn(d){ return tasksFor(d).reduce((n, t) => n + tCost(t.disc, t.target), 0); }
const credBonus = d => (CRED() && CRED().bonusAt != null && credOn(d) >= CRED().bonusAt) ? 1 : 0;
function budgetFor(d){ return COLL() ? Math.max(0, COLL().budget + (credLevel(credOn(d)).budgetDelta || 0) + credBonus(d)) : 0; }
/* ---------- Credibility: moves only on what the customer can see ---------- */
const CRED = () => C.credibility || null;
function credOn(d){ if (!CRED()) return null; const v = (S.credAt || {})[d]; return typeof v === 'number' ? v : (typeof S.cred === 'number' ? S.cred : CRED().start); }
function credLevel(v){
  if (!CRED() || v == null) return {};
  return CRED().levels.slice().sort((a, b) => b.min - a.min).find(l => v >= l.min) || CRED().levels[CRED().levels.length - 1];
}
const STEP_DOWN = {high:'medium', medium:'low', low:'low'};
function effectiveConf(d, conf){ let c = conf; for (let i = 0; i < (credLevel(credOn(d)).caution || 0); i++) c = STEP_DOWN[c] || c; return c; }
function credApply(t, day){
  const K = CRED();
  S.cred = Math.max(K.min == null ? 0 : K.min, Math.min(K.max == null ? 99 : K.max, S.cred + t.delta));
  S.credLog.push({day, id:t.id, delta:t.delta, note:t.note || ''});
}
function credTriggers(d, brief, firedEventIds){
  if (!CRED()) return;
  CRED().triggers.forEach(t => {
    if (t.on === 'reply' && brief.reply === t.reply) credApply(t, d + 1);
    else if (t.on === 'leave' && [].concat(t.state).includes(brief.from) && brief.to !== brief.from && (!t.days || t.days.includes(d)) && !(t.notTo || []).includes(brief.to)) credApply(t, d + 1);
    else if (t.on === 'flag' && firedEventIds.includes(t.event + ':' + t.flag)) credApply(t, d + 1);
    else if (t.on === 'event' && firedEventIds.includes(t.eventId)) credApply(t, d + 1);
    else if (t.on === 'streak' && [].concat(t.confidence).includes(brief.conf)){
      let run = 1; for (let x = d - 1; x >= 1 && S.briefs[x] && [].concat(t.confidence).includes(S.briefs[x].conf); x--) run++;
      if (run >= t.days) credApply(t, d + 1);
    }
  });
}
const credNotes = d => (S.credLog || []).filter(x => x.day === d);
function toggleTask(d, disc, target){
  const list = S.tasks[d] || (S.tasks[d] = []);
  const i = list.findIndex(t => t.disc === disc && t.target === target);
  if (i >= 0){ list.splice(i, 1); return; }
  if (spentOn(d) + tCost(disc, target) > budgetFor(d)) { toast('Not enough collection points today.'); return; }
  list.push({disc, target});
}
function resolveCollection(d){
  if (!COLL()) return;
  tasksFor(d).forEach((t, i) => {
    const arrive = d + tDelay(t.disc, t.target);
    const sid = tSource(t.disc, t.target);
    const rule = (COLL().burnRules || []).find(b => b.discipline === t.disc && b.sourceId === sid);
    const burnOut = () => S.collected.push({id:'F-' + d + '-' + i, arrive, task:d, disc:t.disc, target:t.target, fallback:true, burn:true, text:rule.text, burnNote:rule.postmortem});
    if (rule && burnedOn(sid)) { burnOut(); return; }
    // burn rule: same source tasked on consecutive days
    if (rule && !rule.onFirstTasking && (S.tasks[d-1] || []).some(x => x.disc === t.disc && tSource(x.disc, x.target) === sid)){
      S.burned[sid] = arrive; burnOut(); return;
    }
    const got = new Set(S.collected.map(c => c.id));
    const closed = tgt(t.target).closedWhen && everAt(tgt(t.target).closedWhen);
    const hit = closed ? null : (C.collectionResults || []).find(cr => cr.discipline === t.disc && cr.target === t.target && d >= cr.from && d <= cr.to && condOk(cr.when, d) && !got.has(cr.id));
    if (hit) S.collected.push({id:hit.id, arrive, task:d, disc:t.disc, target:t.target});
    // a result can bring a follow-up item a day or more later
    if (hit && hit.then && !got.has(hit.then.id)) S.collected.push({id:hit.then.id, arrive:arrive + (hit.then.after || 1), task:d, disc:t.disc, target:t.target, follow:true});
    if (!hit) S.collected.push({id:'F-' + d + '-' + i, arrive, task:d, disc:t.disc, target:t.target, fallback:true,
      text:(tgt(t.target).fallback || COLL().fallback || 'Nothing significant at {target}.').replace('{target}', targetById(t.target).name)});
    // burn rule: the first meeting is seen, and the source is gone once it has reported
    if (hit && rule && rule.onFirstTasking) S.burned[sid] = arrive;
  });
}
/* ---------- Hypotheses board (ACH-lite, unscored) ---------- */
const MARKS = ['', 'c', 'i', 'n'];
const MARK_TXT = {'':'·', c:'C', i:'I', n:'–'};
const MARK_WORD = {'':'not marked', c:'consistent', i:'inconsistent', n:'doesn\'t apply'};
const pinsPerDay = () => (C.board && C.board.pinsPerDay) || 3;
const onBoard = id => !!(S.board || {})[id];
const itemDay = id => { const c = (S.collected || []).find(x => x.id === id); return c ? c.arrive : (rep(id) || {}).day; };
const boardIds = () => Object.keys(S.board || {}).filter(id => rep(id)).sort((a, b) => (itemDay(b) - itemDay(a)) || (a < b ? -1 : 1));
const pinnedOn = d => boardIds().filter(id => S.board[id].day === d);
const setAside = id => !!(S.grades[id] || {}).f;
function togglePin(d, id){
  if (S.board[id]){
    if (S.board[id].day !== d){ toast('Pinned on an earlier day. It stays on the board.'); return; }
    delete S.board[id]; return;
  }
  if (pinnedOn(d).length >= pinsPerDay()){ toast('Board is full for today: ' + pinsPerDay() + ' pins a day.'); return; }
  S.board[id] = {day:d, m:{}};
}
function cycleMark(id, h){
  const b = S.board[id]; if (!b) return;
  const nx = MARKS[(MARKS.indexOf(b.m[h] || '') + 1) % MARKS.length];
  if (nx) b.m[h] = nx; else delete b.m[h];
}
function nonDiagnostic(id){
  const v = C.hypotheses.map(h => S.board[id].m[h.id] || '');
  return v.every(x => x) && v.every(x => x === v[0]);
}
function boardTally(){
  const t = {}; C.hypotheses.forEach(h => { t[h.id] = 0; });
  boardIds().forEach(id => { if (setAside(id)) return; C.hypotheses.forEach(h => { if (S.board[id].m[h.id] === 'i') t[h.id]++; }); });
  return t;
}
function boardLead(){
  const t = boardTally(), vals = Object.values(t);
  if (!vals.some(n => n > 0)) return null;
  const min = Math.min(...vals);
  return C.hypotheses.filter(h => t[h.id] === min).map(h => h.id);
}
const leadText = lead => lead.length === 1 ? lead[0] : lead.slice(0, -1).join(', ') + ' and ' + lead[lead.length - 1];

function eventPts(){ return (S.eventPoints || []).reduce((n, x) => n + x.points, 0); }
function burnPoints(){ return Object.keys(S.burned || {}).length * ((COLL() || {}).burnPoints || 0); }
const dayLabel = d => C.dayLabels[d-1] || ('Day ' + d);
const briefCount = () => Object.keys(S.briefs).length;
const curDay = () => Math.min(briefCount() + 1, C.days);
const rank = lvl => (C.asset.levels[lvl] || {rank:0}).rank;
function unlocked(d){
  if (d === 1 || S.playAhead) return true;
  const prev = S.briefs[d-1];
  return !!prev && todayStr() > prev.date;
}
function received(r){ const s0 = C.sources.find(x => x.id === r.sourceId), fg = s0 ? fileGrade(s0) : null;
  return ((fg && fg.g !== s0.startingGrade ? fg.g : r.sourceGrade) || '?') + (r.credibility == null ? '–' : r.credibility); }
function assetLabel(){ return (C.asset.levels[S.asset] || C.asset.levels.home).label; }
const isOpen = d => !S.done && unlocked(d) && !S.briefs[d];

function fresh(){
  return {v:2, crisisId:C.id, started:false, playAhead:!!CFG.playAheadDefault, grades:{}, drafts:{}, briefs:{}, replies:{},
    asset:'home', assetSince:0, deployDays:[], frozenBriefDays:[], firedEvents:[], activeMs:{}, posture:{1:'home'}, feedback:{}, realism:{}, debrief:{}, tipsSeen:{}, tasks:{}, collected:[], burned:{}, board:{}, moves:[], eventPoints:[], flags:{}, carry:{fooled:carryFooled(), reassigned:sinceReassigned().fresh, lostExtras:sinceReassigned().lostExtras}, cred:credStart(), credAt:{1:credStart()}, credStart:credStart(), offRecord:!!REC.runs[C.id], credLog:[], credFinal:null, done:false, ending:null, savedAt:null};
}
function normalize(st){
  if (!st || st.crisisId !== C.id) return null;
  const s = Object.assign(fresh(), clone(st));
  if (s.asset === 'forward') s.asset = 'battalion';
  const TO_CONF = {even:'low', likely:'medium', very:'high', almost:'high', low:'low', moderate:'medium', medium:'medium', high:'high'};
  Object.keys(s.briefs || {}).forEach(k => {
    const b = s.briefs[k], c = TO_CONF[b.conf] || TO_CONF[b.lik];
    delete b.lik;
    if (c){ b.conf = c; return; }
    // Saves from #46 to #49 lost the confidence on reload. Rebuild it from the customer's recorded reply where only one level fits.
    const fits = CONF.map(x => x.id).filter(cf => policyFor({hyp:b.hyp, conf:cf}, (s.posture || {})[k] || 'home', (s.frozenBriefDays || []).includes(Number(k))).reply === b.reply);
    b.conf = fits.length === 1 ? fits[0] : 'medium';
    if (fits.length !== 1) b.confLost = true;
  });
  Object.values(s.drafts || {}).forEach(dr => { dr.conf = TO_CONF[dr.conf] || TO_CONF[dr.lik] || null; delete dr.lik; delete dr.note; });
  if (!C.asset.levels[s.asset]) s.asset = 'home';
  if (!s.board || typeof s.board !== 'object') s.board = {};
  if (CRED() && typeof s.cred !== 'number'){ s.cred = CRED().start; s.credAt = {1:CRED().start}; s.credLog = []; }
  if (CRED() && st.credStart === undefined && st.started) s.credStart = CRED().start;
  if (st.offRecord === undefined) s.offRecord = false;
  return s;
}

/* ---------- Customer policy, events, endings, scoring ---------- */
function matchCond(cond, brief, asset){
  if (cond.hypothesis && ![].concat(cond.hypothesis).includes(brief.hyp)) return false;
  if (cond.confidence && !cond.confidence.includes(brief.conf)) return false;
  if (cond.assetAt && ![].concat(cond.assetAt).includes(asset)) return false;
  return true;
}
function resolvePolicy(day, brief){ return policyFor(Object.assign({}, brief, {conf:effectiveConf(day, brief.conf)}), S.asset, S.frozenBriefDays.includes(day)); }
function policyFor(brief, asset, frozen){
  const rule = C.customerPolicy.find(r => matchCond(r.if, brief, asset));
  if (rule && rule.reply){   // named states: the rule gives the reply and, optionally, the state to move to
    if (rule.sends && frozen) return {reply:rule.frozenReply || 'frozen', asset};
    return {reply:rule.reply, asset:rule.to || asset, deployed:!!rule.to && rule.to !== asset};
  }
  const action = rule ? rule.action : 'hold';
  if (action === 'deploy'){
    const target = rule.level || 'battalion';
    if (rank(asset) >= rank(target)) return {reply:'hold_' + asset, asset};
    if (frozen) return {reply:'frozen', asset};
    return {reply:(asset === 'home' ? 'deploy_' : 'upgrade_') + target, asset:target, deployed:true};
  }
  if (action === 'withdraw') return {reply:'withdraw', asset:'home'};
  return {reply:action, asset};
}
function eventFires(cond){
  if (cond.deployedOnAnyDay && !S.deployDays.some(d => cond.deployedOnAnyDay.includes(d))) return false;
  if (cond.movedTo && !(S.moves || []).some(m => m.to === cond.movedTo.state && cond.movedTo.days.includes(m.day))) return false;
  return true;
}
function outcomeFits(c){
  if (c.assetAt && ![].concat(c.assetAt).includes(S.asset)) return false;
  if (c.since && !c.since.includes(S.assetSince)) return false;
  return true;
}
function applyEffect(eff, day){
  if (eff.assetTo && eff.assetTo !== S.asset){ S.asset = C.asset.levels[eff.assetTo] ? eff.assetTo : 'home'; S.assetSince = day; }
  if (eff.freezeBriefDays) eff.freezeBriefDays.forEach(d => { if (!S.frozenBriefDays.includes(d)) S.frozenBriefDays.push(d); });
}
function evalEnding(){
  for (const e of C.endings){
    if (e.default) return e;
    const c = e.if || {};
    if (c.assetAt && ![].concat(c.assetAt).includes(S.asset)) continue;
    if (c.since && !c.since.includes(S.assetSince)) continue;
    if (c.everAt && !(S.moves || []).some(m => m.to === c.everAt)) continue;
    return e;
  }
  return C.endings[C.endings.length-1];
}
function scoreDay(d){
  const b = S.briefs[d];
  const t = C.groundTruth.find(g => g.day === d);
  const right = b.hyp === t.trueHypothesis;
  const pay = C.scoring.call[b.conf];
  const call = right ? pay[0] : pay[1];
  const ev = b.evidence.reduce((s, id) => s + (C.scoring.evidence[rep(id).kind] || 0), 0);
  return {right, call, ev, truth:t};
}
function doubtPoints(){
  return seenReports().reduce((s, r) => s + ((S.grades[r.id] || {}).f ? (C.scoring.challenge[r.kind] || 0) : 0), 0);
}

/* ---------- Actions ---------- */
function draft(d){
  if (!S.drafts[d]) S.drafts[d] = {hyp:null, conf:null, evidence:[]};
  return S.drafts[d];
}
function sendBrief(d){
  tick();
  const dr = draft(d);
  const ev = dr.evidence.slice(0, C.scoring.maxEvidence);
  const brief = {hyp:dr.hyp, conf:dr.conf, evidence:ev,
    date:todayStr(), sentAt:new Date().toISOString(), minutes:Math.max(1, Math.round((S.activeMs[d] || 0)/60000))};
  const res = resolvePolicy(d, brief);
  brief.from = S.asset; brief.to = res.asset;
  if (res.asset !== S.asset){ S.moves.push({day:d, from:S.asset, to:res.asset}); S.asset = res.asset; S.assetSince = d; }
  if (res.deployed) S.deployDays.push(d);
  brief.reply = res.reply;
  brief.tasks = clone(tasksFor(d));
  brief.board = {pins:pinnedOn(d).length, lead:boardLead()};
  if (CRED()){ brief.cred = credOn(d); if (effectiveConf(d, brief.conf) !== brief.conf) brief.actedAs = effectiveConf(d, brief.conf); }
  const fired = [];
  S.briefs[d] = brief;
  delete S.drafts[d];
  resolveCollection(d);
  if (d < C.days){
    S.replies[d+1] = {key:res.reply};
    C.events.filter(e => (e.atStartOfDay === d+1 || (e.onEnter && brief.to === e.onEnter && brief.from !== e.onEnter)) && (e.repeat || !S.firedEvents.includes(e.id))).forEach(e => {
      if (!eventFires(e.if || {})) return;
      // An event with outcomes reads where the customer's force is and takes the first outcome that fits.
      const o = e.outcomes ? e.outcomes.find(x => outcomeFits(x.if || {})) : e;
      if (!o) return;
      applyEffect(o.effect || {}, d+1);
      S.firedEvents.push(e.id); fired.push(e.id);
      if (e.outcomes){ S.flags[e.id] = o.flag; fired.push(e.id + ':' + o.flag); }
      if (o.points || e.outcomes) S.eventPoints.push({day:d+1, id:e.id, points:o.points || 0, label:o.pointsLabel || e.pointsLabel || 'events', title:o.title || ''});
      S.replies[d+1] = {key:o.replyId, note:o.note || ''};
    });
    S.posture[d+1] = S.asset;
    if (CRED()){ credTriggers(d, brief, fired); S.credAt[d+1] = S.cred; }
    ui.tab = 'inbox';
  } else {
    S.done = true;
    S.ending = evalEnding().id;
    S.summary = {title:evalEnding().title, total:totalScore()};
    if (CRED()){
      credTriggers(d, brief, fired);
      const o = ((CRED().outcome || {})[S.ending] || 0) + (CRED().outcomeFlags || []).reduce((n, x) => n + (S.flags[x.event] === x.flag ? x.delta : 0), 0);
      S.credEnd = S.cred;
      if (o) credApply({id:'outcome', delta:o, note:''}, d + 1);
      S.credFinal = S.cred;
    }
    commitRecord();
    ui.tab = 'postmortem';
  }
  ui.pin = null;
  save();
  window.scrollTo(0, 0);
}

/* ---------- Active-time clock: visible page, input in the last 2 min ---------- */
let lastAct = Date.now(), lastTick = Date.now();
function tick(){
  const now = Date.now(), dt = Math.min(now - lastTick, TICK_MS);
  lastTick = now;
  if (!C || !S || !S.started || S.done || document.hidden || now - lastAct > IDLE_MS) return;
  const d = curDay();
  if (!isOpen(d)) return;
  S.activeMs[d] = (S.activeMs[d] || 0) + dt;
}
['pointerdown','keydown','input','scroll','touchstart'].forEach(t => document.addEventListener(t, () => { lastAct = Date.now(); }, {passive:true}));

/* ---------- Persistence: account storage with a local fallback ---------- */
let saveTimer = null, writing = false, again = false;
function save(){
  S.savedAt = new Date().toISOString();
  try { localStorage.setItem(LS_PREFIX + C.id, JSON.stringify(S)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { flush(); ptSync(); }, 500);
}
let ptWriting = false, ptAgain = false;
async function ptSync(){
  if (!CFG.playtest || !ptRef || !S.started || ptRuns === null) return;
  if (ptWriting){ ptAgain = true; return; }
  ptWriting = true;
  try {
    const run = {crisisId:C.id, updatedAt:S.savedAt, day:curDay(), done:S.done, ending:S.ending || null,
      log:playtestLog(), briefs:clone(S.briefs), grades:clone(S.grades), feedback:clone(S.feedback),
      realism:clone(S.realism), debrief:clone(S.debrief), activeMs:clone(S.activeMs)};
    ptRuns[C.id] = run;
    await ptRef.set(Object.assign({}, run, {runs:clone(ptRuns)}));
  } catch(e) { /* the local save still has everything */ }
  ptWriting = false;
  if (ptAgain){ ptAgain = false; ptSync(); }
}
async function flush(){
  if (store.mode !== 'db' || !store.ref) return;
  if (writing){ again = true; return; }
  writing = true;
  try {
    await store.ref.set({state:clone(S), savedAt:S.savedAt});
    store.ok = true;
  } catch(e) {
    store.ok = false;
    const code = e && e.code;
    if (['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(code)) store.mode = 'local';
  }
  writing = false;
  updateSaveStatus();
  if (again){ again = false; flush(); }
}
function loadLocal(){
  try { const raw = localStorage.getItem(LS_PREFIX + C.id); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
async function connectAccount(){
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { updateSaveStatus(); return; }
  try {
    const both = await Promise.all([cl.use('user'), cl.use('db')]);
    const user = both[0], db = both[1];
    if (!user || !db) { updateSaveStatus(); return; }
    USER = user; DB = db;
    try { ui.isOwner = !!(await Promise.resolve(user.isOwner && user.isOwner())); } catch(e) { ui.isOwner = false; }
    const uid = await user.id();
    if (!uid) { updateSaveStatus(); return; }
    if (CFG.playtest) ptRef = db.doc('playtests/' + uid);
    if (CFG.playtest && ptRuns === null){
      try {
        const ps = await ptRef.get(); const pd = ps.exists ? (ps.data() || {}) : {};
        if (pd.runs) ptRuns = clone(pd.runs);
        else if (pd.crisisId){ const one = clone(pd); delete one.runs; ptRuns = {}; ptRuns[pd.crisisId] = one; }
        else ptRuns = {};
      } catch(e) { ptRuns = {}; }
    }
    if (CFG.playtest && !ui.isOwner){
      try { const m = await db.doc('meta/owner').get(); ui.isOwner = !!(m && m.exists); } catch(e) {}
    }
    const ref = db.collection('data/users/' + uid).doc('save-' + C.id);
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000))]);
    store = {mode:'db', ref, ok:true};
    syncRecord(db, uid).then(() => remoteProgress(db, uid));
    const remote = snap.exists ? normalize((snap.data() || {}).state) : null;
    if (remote && (!S.savedAt || (remote.savedAt || '') > S.savedAt)) {
      S = remote;
      try { localStorage.setItem(LS_PREFIX + C.id, JSON.stringify(S)); } catch(e) {}
      render();
    } else if (S.savedAt) {
      flush();
    }
  } catch(e) { /* stay on device storage */ }
  updateSaveStatus();
  if (CFG.playtest && ptRef && S.started) ptSync();
  if (ui.isOwner && CFG.playtest) render();
}
function saveStatusText(){
  if (store.mode === 'db') return store.ok ? 'Saved to your account' : 'Saving…';
  return 'Saved on this device only';
}
function updateSaveStatus(){
  const el = document.getElementById('savestatus');
  if (el) el.textContent = saveStatusText();
}

/* ---------- Map ---------- */
function friendlySym(x, y, label, small){
  const w = small ? 26 : 34, h = small ? 17 : 22;
  return '<g class="m-fr" transform="translate(' + (x - w/2) + ',' + (y - h/2) + ')"><rect width="' + w + '" height="' + h + '" rx="1"/>'
    + '<line x1="0" y1="0" x2="' + w + '" y2="' + h + '"/><line x1="' + w + '" y1="0" x2="0" y2="' + h + '"/>'
    + '<text x="' + (w/2) + '" y="' + (h + 11) + '" text-anchor="middle">' + esc(label) + '</text></g>';
}
function hostileSym(x, y, label){
  return '<g class="m-hu" transform="translate(' + x + ',' + y + ')"><path d="M0,-11 L11,0 L0,11 L-11,0 Z"/>'
    + '<text x="0" y="23" text-anchor="middle">' + esc(label) + '</text></g>';
}
function mapSVG(opt){
  const M = C.map;
  const vb = M.viewBox;
  let g = '<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="m-hatch"/></pattern></defs>';
  g += '<rect x="0" y="0" width="' + vb[2] + '" height="' + vb[3] + '" class="m-land"/>';
  if (M.border) g += '<path class="m-elsin" d="' + M.border + ' L' + vb[2] + ',0 L' + vb[2] + ',' + vb[3] + ' Z"/>';
  (M.areas || []).forEach(a => { g += '<path class="m-area" d="' + a.d + '"/>' + (a.label ? '<text class="m-off" x="' + a.lx + '" y="' + a.ly + '">' + esc(a.label) + '</text>' : ''); });
  (M.zones || []).forEach(z => { g += '<rect class="m-zone" x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="8"/><text class="m-zonelab" x="' + (z.x + 2) + '" y="' + (z.y - 6) + '">' + esc(z.label) + '</text>'; });
  (M.highlands || []).forEach(h => h.r.forEach(r => { g += '<circle class="m-hill" cx="' + h.cx + '" cy="' + h.cy + '" r="' + r + '"/>'; }));
  (M.forests || []).forEach(f => { g += '<path class="m-forest" d="' + f.d + '"/><text class="m-lab" x="' + f.lx + '" y="' + f.ly + '">' + esc(f.label) + '</text>'; });
  const t = M.training;
  if (t) g += '<ellipse class="m-train" cx="' + t.cx + '" cy="' + t.cy + '" rx="' + t.rx + '" ry="' + t.ry + '"/><text class="m-lab" x="' + (t.cx - t.rx) + '" y="' + (t.cy - t.ry - 6) + '">' + esc(t.label) + '</text>';
  if (M.reservoir) g += '<path class="m-res" d="' + M.reservoir + '"/>';
  if (M.river) g += '<path class="m-river" d="' + M.river.d + '"/><text class="m-rivlab" x="' + (M.river.lx || 470) + '" y="' + (M.river.ly || 324) + '" transform="rotate(' + (M.river.rot == null ? 34 : M.river.rot) + ' ' + (M.river.lx || 470) + ' ' + (M.river.ly || 324) + ')">' + esc(M.river.name) + '</text>';
  (M.lines || []).forEach(l => { g += '<path class="m-pipe" d="' + l.d + '"/>' + (l.label ? '<text class="m-lab" x="' + l.lx + '" y="' + l.ly + '">' + esc(l.label) + '</text>' : ''); });
  if (M.border) g += '<path class="m-border" d="' + M.border + '"/>';
  (M.regions || []).forEach(r => { g += '<text class="m-region" x="' + r.x + '" y="' + r.y + '">' + esc(r.name) + '</text>'; });
  (M.places || []).forEach(p => {
    if (p.type === 'dam') g += '<line class="m-dam" x1="' + (p.x - 6) + '" y1="' + (p.y + 6) + '" x2="' + (p.x + 6) + '" y2="' + (p.y - 6) + '"/>';
    else if (p.type === 'crossing') g += '<path d="M' + (p.x-5) + ',' + (p.y-5) + ' L' + (p.x+5) + ',' + (p.y+5) + ' M' + (p.x+5) + ',' + (p.y-5) + ' L' + (p.x-5) + ',' + (p.y+5) + '" class="m-dam" style="stroke-width:2"/>';
    else if (p.type === 'depot') g += '<rect class="m-place" x="' + (p.x-5) + '" y="' + (p.y-5) + '" width="10" height="10"/>';
    else if (p.type === 'rail') g += '<path class="m-dam" style="stroke-width:1.5" d="M' + (p.x-10) + ',' + p.y + ' L' + (p.x+10) + ',' + p.y + ' M' + (p.x-6) + ',' + (p.y-3) + ' L' + (p.x-6) + ',' + (p.y+3) + ' M' + p.x + ',' + (p.y-3) + ' L' + p.x + ',' + (p.y+3) + ' M' + (p.x+6) + ',' + (p.y-3) + ' L' + (p.x+6) + ',' + (p.y+3) + '"/>';
    else g += '<circle class="m-place" cx="' + p.x + '" cy="' + p.y + '" r="4"/>';
    g += '<text class="m-lab" x="' + p.lx + '" y="' + p.ly + '">' + esc(p.name) + '</text>';
  });
  (M.offmap || []).forEach(o => { g += '<text class="m-off" x="' + o.x + '" y="' + o.y + '">↖ ' + esc(o.text) + '</text>'; });
  if (M.scaleKm) g += '<line class="m-scale" x1="' + (vb[2] - 80) + '" y1="' + (vb[3] - 14) + '" x2="' + (vb[2] - 80 + M.scaleUnits) + '" y2="' + (vb[3] - 14) + '"/><text class="m-off" x="' + (vb[2] - 80) + '" y="' + (vb[3] - 20) + '">' + M.scaleKm + ' km</text>';

  // Ground truth (postmortem only)
  if (opt.truthDay){
    const gt = C.groundTruth.find(x => x.day === opt.truthDay);
    (gt.units || []).forEach(u => { g += hostileSym(u.x, u.y, u.label); });
  }
  // Own forces
  const fr = M.friendly, a = opt.asset || 'home';
  if (M.forces) (M.forces[a] || M.forces.home || []).forEach(f => { g += friendlySym(f.x, f.y, f.label, f.small); });
  else if (!fr) { /* no forces to plot in this crisis */ }
  else if (a === 'battalion') g += friendlySym(fr.forward.x, fr.forward.y, '2 Bn');
  else if (a === 'company'){ g += friendlySym(fr.forward.x, fr.forward.y, 'A Coy (+)', true); g += friendlySym(fr.home.x, fr.home.y - 22, '2 Bn (-)'); }
  else g += friendlySym(fr.home.x, fr.home.y - 22, '2 Bn');

  // Reporting pins
  let pins = [];
  if (opt.onlyDay) pins = reportsFor(opt.onlyDay);
  else for (let x = 1; x <= opt.uptoDay; x++) pins.push(...reportsFor(x));
  pins = pins.filter(r => r.pin);
  // today's taskings: dashed rings on their targets
  if (COLL() && opt.today && !opt.onlyDay && !S.done) tasksFor(opt.today).forEach(t => { const tg = targetById(t.target); if (tg.pin) g += '<circle class="m-task" cx="' + tg.pin.x + '" cy="' + tg.pin.y + '" r="15"><title>' + esc(t.disc + ' tasked on ' + tg.name) + '</title></circle>'; });
  const slot = {};
  pins.forEach(r => {
    const key = r.pin.x + ',' + r.pin.y; const i = slot[key] = (slot[key] || 0) + 1;
    const x = r.pin.x + (i - 1) * 11, y = r.pin.y - (i - 1) * 4;
    const g0 = S.grades[r.id] || {};
    const cls = 'm-pin' + (r.day === opt.today ? ' today' : '') + (g0.f ? ' doubted' : '') + (ui.pin === r.id ? ' sel' : '');
    g += '<g class="' + cls + '" data-act="pin" data-id="' + r.id + '" role="button" tabindex="0" aria-label="' + esc(r.id + ': ' + r.pin.label) + '">'
      + '<circle class="hit" cx="' + x + '" cy="' + y + '" r="13"/><circle class="dot" cx="' + x + '" cy="' + y + '" r="6"/>'
      + (r.day === opt.today || ui.pin === r.id ? '<text x="' + (x + 8) + '" y="' + (y - 6) + '">' + r.id.slice(2) + '</text>' : '')
      + '<title>' + esc(r.id + ': ' + r.pin.label) + '</title></g>';
  });
  return '<svg viewBox="' + vb.join(' ') + '" role="img" aria-label="' + esc(M.title || 'Situation map') + '">' + g + '</svg>';
}

function analystsCard(){

  return '<div class="stack"><h3>Your analysts</h3>' + TEAM().map(a => {
    const ns = (C.notes || []).filter(n => n.analyst === a.id && seen.has(n.item));
    const score = ns.reduce((t, n) => t + (n.right || 0), 0);
    return '<div class="reveal"><div class="head"><b>' + esc(a.name) + '</b><span>' + esc(a.specialty) + '</span><span class="pill">Right ' + (Number.isInteger(score) ? score : score.toFixed(1).replace('.5', '½').replace('0½', '½')) + ' of ' + ns.length + '</span></div>'
      + '<p class="what">' + esc(a.reveal || '') + '</p>'
      + ns.map(n => '<p class="small"><span class="mono">' + (n.right === 1 ? '✓' : n.right ? '~' : '✗') + ' ' + esc(n.item) + '</span> <q>' + esc(n.text) + '</q> ' + esc(n.why || '') + '</p>').join('')
      + '</div>';
  }).join('') + '<p class="small muted">Notes are opinion. They weren\'t scored.</p></div>';
}
function pinChip(r){

}
function itemCard(r, editable, pinnable){

    + '<header class="cable-h"><span class="rid">' + r.id + '</span><span class="src">' + esc(s.codeName) + '</span><span>' + esc(r.discipline) + '</span>' + (r.collected ? '<span class="pill tasked">Your tasking</span>' : '') + '<span class="recv" title="' + esc(recvTitle(r)) + '">' + received(r) + '</span></header>'
    + '<p class="cable-t">' + esc(r.text) + '</p>'

      + (CFG.playtest ? '<button class="chip rflag" data-act="realism" data-id="' + r.id + '" aria-pressed="' + !!S.realism[r.id] + '" title="Playtest: tell the designer this item doesn\'t ring true">' + (S.realism[r.id] ? 'Flagged as unrealistic' : 'Not realistic?') + '</button>' : '')

function recvTitle(r){

}
function gradeSummary(g){
  const parts = [];
  if (g && g.f) parts.push('<b>You doubted it</b>');
  if (g && g.n) parts.push('<b>marked not relevant</b>');
  return parts.length ? parts.join(' · ') : 'Accepted as received';
}

function openingCard(d){
  const O = C.opening || {}; if (d !== 1) return '';

  const run = re ? null : sinceReassigned().same;

function replyCard(d){

    + credNotes(d).map(x => '<p class="note crednote">' + esc(x.note) + ' Now: <b>' + esc(credLevel(credOn(d)).label) + '</b>. ' + esc(credLevel(credOn(d)).text || '') + '</p>').join('')
    + '</div>';
}

function earlierDays(upTo){
  let html = '';

    const b = S.briefs[d];
    html += '<details><summary><span>Day ' + d + ' · ' + esc(dayLabel(d)) + '</span><span class="mono small muted">' + (b ? callLabel(b) : '') + '</span></summary><div class="inner">'
      + (b ? briefRecord(d) : '')

      + '</div></details>';
  }
  return html ? '<div class="stack"><div class="section-h"><h3>Earlier days</h3></div>' + html + '</div>' : '';
}

function inboxView(d){
  const items = reportsFor(d);
  const doubted = items.filter(r => (S.grades[r.id] || {}).f).length;
  return readInCard(d)
    + mapCard(d)
    + replyCard(d) + openingCard(d)
    + '<div class="section-h"><h2>Inbox</h2><span class="mono small muted">' + doubted + ' doubted</span></div>'
    + '<p class="small muted">Each item arrives graded by its collector: the letter is the source\'s track record, the number is how credible the information looks. A good source can still carry a bad report. If you think an item is false or deliberately misleading, doubt it. Doubts are scored in the postmortem.</p>'
    + '<div class="stack">' + items.map(r => itemCard(r, true)).join('') + '</div>'

}

function briefRecord(d){
  const b = S.briefs[d];
  if (!b) return '';
  const h = hyp(b.hyp);
  return '<div class="record"><span class="stamp">' + b.hyp + ' · ' + confLabel(b.conf) + ' confidence<small>Day ' + d + ' brief · sent</small></span>'
    + '<p class="kj">' + esc(keyJudgment(b)) + '</p>'
    + '<p><b>' + esc(h.short) + '.</b> ' + esc(h.text) + '</p>'
    + '<p class="small"><span class="muted">Key evidence:</span> <span class="mono">' + (b.evidence.length ? b.evidence.join(', ') : 'none') + '</span></p>'
    + '<p class="small"><span class="muted">' + esc(CUST()) + ':</span> ' + esc(C.replyLabels[b.reply] || '') + '</p>'
    + '</div>';
}

function briefView(d){
  const dr = draft(d);
  const items = reportsFor(d);
  const frozen = S.frozenBriefDays.includes(d);
  let predict = '';
  if (dr.hyp && dr.conf){
    const res = resolvePolicy(d, {hyp:dr.hyp, conf:dr.conf});
    predict = '<p class="predict">If you send this, ' + esc(CUST()) + ': <b>' + esc(C.replyLabels[res.reply]) + '</b>.</p>';
  }
  const full = dr.evidence.length >= C.scoring.maxEvidence;
  const eviBtn = r => {
    const on = dr.evidence.includes(r.id);
    return '<button class="evi" data-act="ev" data-id="' + r.id + '" aria-pressed="' + on + '"' + (!on && full ? ' disabled' : '') + '><span class="id">' + r.id + '</span><span>' + esc(src(r.sourceId).codeName) + ': ' + esc(r.text.length > 90 ? r.text.slice(0, 88) + '…' : r.text) + '</span></button>';
  };
  let groups = '<div class="evigroup"><h4>Today</h4>' + items.map(eviBtn).join('') + '</div>';
  for (let x = d-1; x >= 1; x--) groups += '<details><summary><span>Day ' + x + ' items</span></summary><div class="inner evigroup">' + reportsFor(x).map(eviBtn).join('') + '</div></details>';
  const ready = dr.hyp && dr.conf;
  const tip = S.tipsSeen.brief ? '' : '<div class="msg tip"><span class="from">How the brief works · shown once</span>'
    + '<p><b>1. Your judgment.</b> Pick the hypothesis you think is true today.</p>'
    + '<p><b>2. Your confidence.</b> Low, Medium or High. Say what you actually believe: High pays most when you\'re right and costs most when you\'re wrong.</p>'
    + '<p><b>3. Your evidence.</b> Cite up to 3 items that back your call. They\'re scored in the postmortem by what they really were, so a planted item costs you.</p>'
    + '<p><b>' + esc(CUST()) + ' acts on your confidence.</b> ' + esc(C.customer.tipLine || 'High gets the full move. Medium gets a partial one, and Low gets none.') + '</p>'
    + '<div class="btnrow"><button class="btn ghost" data-act="tipseen" data-v="brief">Got it</button></div></div>';
  return tip + '<div class="section-h"><h2>Day ' + d + ' brief</h2></div>'
    + '<div class="msg"><span class="from">Tasking · ' + esc(C.customer.callsign) + '</span><p>' + esc(C.customer.wants) + '</p>'
    + '<p class="note">' + esc(C.asset.name) + ': ' + esc(assetLabel()) + '.' + (frozen ? ' ' + esc(C.frozenText || 'Troop moves are frozen today.') : '') + ' ' + esc(C.policyNote || '') + '</p>'
    + (CRED() && credLevel(credOn(d)).caution ? '<p class="note crednote">Credibility <b>' + esc(credLevel(credOn(d)).label) + '</b>: ' + PRON()[0] + '\'ll act on your confidence as one step lower.</p>' : '') + '</div>'
    + boardNudge()
    + '<fieldset><legend>Judgment</legend>' + C.hypotheses.map(h => '<button class="opt" data-act="hyp" data-v="' + h.id + '" aria-pressed="' + (dr.hyp === h.id) + '"><span class="k">' + h.id + '</span><span class="t">' + esc(h.short) + '</span><span class="d">' + esc(h.text) + '</span></button>').join('') + '</fieldset>'
    + '<fieldset><legend>Confidence</legend><div class="confs">' + CONF.map(c => '<button class="conf c-' + c.id + '" data-act="conf" data-v="' + c.id + '" aria-pressed="' + (dr.conf === c.id) + '"><b>' + c.label + '</b></button>').join('') + '</div></fieldset>'
    + '<fieldset><legend>Key evidence · ' + dr.evidence.length + ' of ' + C.scoring.maxEvidence + '</legend>' + groups + '</fieldset>'

}

function boardNudge(){
  const lead = boardLead();
  if (!lead) return '';
  const t = boardTally();
  return '<p class="nudge"><span class="mono small muted">Your board</span> ' + (lead.length === 1 ? '<b>' + lead[0] + '</b> is the least contradicted' : '<b>' + leadText(lead) + '</b> tie as least contradicted')
    + '. <span class="mono small muted">Inconsistent: ' + C.hypotheses.map(h => h.id + ' ' + t[h.id]).join(' · ') + '</span> <button class="linkbtn" data-act="tab" data-v="board">Open board</button></p>';
}
function boardRow(id, d, done, cols){
  const r = rep(id), b = S.board[id], aside = setAside(id), nd = !aside && nonDiagnostic(id);
  const cells = C.hypotheses.map(h => {
    const m = b.m[h.id] || '';
    return '<button class="bcell m-' + (m || 'none') + '" data-act="mark" data-id="' + id + '" data-h="' + h.id + '"' + (done ? ' disabled' : '') + ' aria-label="' + esc(id + ' against ' + h.id + ': ' + MARK_WORD[m]) + '">' + MARK_TXT[m] + '</button>';
  }).join('');
  const tags = (aside ? '<span class="pill">Doubted · set aside</span>' : '') + (nd ? '<span class="pill">Fits everything</span>' : '')
    + (done ? '<span class="pill k-' + r.kind + '">' + KIND_LABEL[r.kind] + '</span>' : '');
  const unpin = !done && b.day === d ? '<button class="linkbtn" data-act="bpin" data-id="' + id + '">Unpin</button>' : '';
  return '<div class="brow' + (aside || nd ? ' dim' : '') + '" style="' + cols + '"><div class="bitem"><span class="mono small"><b>' + id + '</b> · ' + esc(src(r.sourceId).codeName) + ' · Day ' + itemDay(id) + '</span>'
    + '<span class="btext">' + esc(r.text.length > 110 ? r.text.slice(0, 108) + '…' : r.text) + '</span>' + (tags || unpin ? '<span class="btags">' + tags + unpin + '</span>' : '') + '</div>' + cells + '</div>';
}
function boardTable(d, done){
  const ids = boardIds(), t = boardTally(), lead = boardLead() || [];
  const cols = 'grid-template-columns:minmax(0,1fr) repeat(' + C.hypotheses.length + ',44px)';
  return '<div class="board" style="--bcols:' + C.hypotheses.length + '">'
    + '<div class="brow bhead" style="' + cols + '"><span class="mono small muted">Item</span>' + C.hypotheses.map(h => '<span class="bh" title="' + esc(h.short) + '">' + h.id + '</span>').join('') + '</div>'
    + ids.map(id => boardRow(id, d, done, cols)).join('')
    + '<div class="brow bfoot" style="' + cols + '"><span class="mono small muted">Inconsistent</span>' + C.hypotheses.map(h => '<span class="bt' + (lead.includes(h.id) ? ' lead' : '') + '">' + t[h.id] + '</span>').join('') + '</div>'
    + '</div>';
}
function boardView(d, done){
  const ids = boardIds(), lead = boardLead();
  const tip = done || S.tipsSeen.board ? '' : '<div class="msg tip"><span class="from">How the board works · shown once</span>'
    + '<p>A light version of Analysis of Competing Hypotheses. Pin up to ' + pinsPerDay() + ' items a day from the Inbox. Then tap each cell to mark the item against each hypothesis: <b>C</b> consistent, <b>I</b> inconsistent, <b>–</b> doesn\'t apply.</p>'
    + '<p>Count what contradicts, not what fits. The hypothesis with the fewest inconsistencies is the one still standing. An item that fits every hypothesis can\'t tell them apart, so the board greys it out. Items you\'ve doubted are set aside.</p>'
    + '<p>The board isn\'t scored. It\'s there to help you make the call.</p>'
    + '<div class="btnrow"><button class="btn ghost" data-act="tipseen" data-v="board">Got it</button></div></div>';
  let html = tip + (done ? '' : '<div class="section-h"><h2>Hypotheses board</h2><span class="mono small">' + pinnedOn(d).length + '/' + pinsPerDay() + ' pins today</span></div>');
  if (!ids.length) return html + '<p class="small muted">Nothing pinned yet. Use <b>Pin to board</b> on any item in the Inbox.</p><div class="btnrow"><button class="btn ghost" data-act="tab" data-v="inbox">Back to the Inbox</button></div>';
  html += '<div class="legend small">' + C.hypotheses.map(h => '<span><b>' + h.id + '</b> ' + esc(h.short) + '</span>').join('') + '</div>'
    + boardTable(d, done)
    + '<p class="small">' + (lead ? (lead.length === 1 ? '<b>' + lead[0] + '</b> is the least contradicted.' : '<b>' + leadText(lead) + '</b> tie as least contradicted.') : '') + '</p>'
    + (lead || done ? '' : '<div class="msg tip"><span class="from">No lead yet</span><p>The board only counts what <b>contradicts</b> a hypothesis, and nothing here is marked <b>I</b>. For each item, ask which hypothesis it makes harder to believe, and tap that cell until it shows <b>I</b>. An item marked C all the way across tells you nothing.</p></div>');
  if (done) return html;
  return html + '<div class="btnrow"><button class="btn" data-act="tab" data-v="brief">Write the brief</button></div>';
}

// What you've already asked of a target and what came back. Your own history only: it never says whether more is there.
function taskHistory(tid, d){
  const rows = (S.collected || []).filter(c => c.target === tid && c.task < d && !c.follow).sort((a, b) => a.task - b.task);
  if (!rows.length) return '';
  return '<p class="small muted thist">Asked before: ' + rows.map(c => 'Day ' + c.task + ' ' + esc(c.disc) + ' → ' + (c.arrive > d ? 'on its way' : (/^F-/.test(c.id) ? 'nothing new' : esc(c.id)))).join(' · ') + '</p>';
}
function collectView(d){
  const K = COLL(), left = budgetFor(d) - spentOn(d);
  const pending = (S.collected || []).filter(c => c.arrive > d && c.task < d);
  const tip = S.tipsSeen.collect ? '' : '<div class="msg tip"><span class="from">How collection works · shown once</span>'
    + '<p>You have ' + K.budget + ' points a day. Spend them on the targets that answer your intelligence requirements (PIRs). Results arrive the next morning unless the button shows a longer wait (2d).</p>'
    + '<p>Some taskings find nothing, and some carry risk: a source can be burned, and a target can go dark. Taskings lock when you send the brief.</p>'
    + '<div class="btnrow"><button class="btn ghost" data-act="tipseen" data-v="collect">Got it</button></div></div>';
  const B = budgetFor(d), trimmed = K.budget - B;
  let html = tip + '<div class="section-h"><h2>Collection</h2><span class="mono small">' + left + ' of ' + B + ' points left</span></div>'
    + '<div class="meter" aria-hidden="true">' + Array.from({length:Math.max(K.budget, B)}, (_, i) => '<span class="' + (i < spentOn(d) ? 'on' : (i >= B ? 'cut' : '')) + '"></span>').join('') + '</div>'
    + (credBonus(d) ? '<p class="small crednote">1 extra point: ' + esc(CUST()) + ' trusts your cell.</p>' : '')
    + (trimmed > 0 ? '<p class="small crednote">' + trimmed + ' point' + (trimmed > 1 ? 's' : '') + ' cut: credibility with ' + esc(C.customer.name) + ' is <b>' + esc(credLevel(credOn(d)).label) + '</b>.</p>' : '');
  C.pirs.forEach(p => {
    html += '<div class="card pir"><p class="mono small muted">' + esc(p.id) + '</p><p><b>' + esc(p.question) + '</b></p>';
    p.targets.forEach(tid => {
      const tg = targetById(tid);
      if ((tg.from && d < tg.from) || !condOk(tg.when)) return;
      const closed = tg.closedWhen && everAt(tg.closedWhen);
      html += '<div class="trow"><span class="tname">' + esc(tg.name) + '</span><div class="toggles">' + (tg.disciplines || []).map(disc => {
        const on = tasksFor(d).some(t => t.disc === disc && t.target === tid);
        const cost = tCost(disc, tid), sid = tSource(disc, tid);
        const burned = burnedOn(sid) && d >= burnedOn(sid);
        const dis = !on && (cost > left || burned || closed);
        const delay = tDelay(disc, tid);
        return '<button class="chip task" data-act="task" data-disc="' + disc + '" data-target="' + tid + '" aria-pressed="' + on + '"' + (dis ? ' disabled' : '') + ' title="' + (delay > 1 ? 'Arrives in ' + delay + ' days' : 'Arrives tomorrow') + '">' + disc + ' · ' + cost + (delay > 1 ? ' · ' + delay + 'd' : '') + (burned ? ' · gone' : (closed ? ' · closed' : '')) + '</button>';
      }).join('') + '</div></div>' + taskHistory(tid, d);
    });
    html += '</div>';
  });
  if (pending.length) html += '<div class="card"><p class="mono small muted">Still on its way</p>' + pending.map(c => '<p class="small">' + esc(c.disc) + ' · ' + esc(targetById(c.target).name) + ' · arrives Day ' + c.arrive + '</p>').join('') + '</div>';
  return html + '<div class="btnrow"><button class="btn" data-act="tab" data-v="brief">Write the brief</button></div>';
}

function countdownText(){ const ms = msToMidnight(); const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000); return 'Opens in ' + h + ' h ' + m + ' min.'; }

    + '<p>Your brief is with ' + esc(CUST()) + '. ' + cap(PRON()[1]) + ' reply and the new inbox arrive at midnight. <span id="countdown" class="mono small">' + countdownText() + '</span></p>'
    + briefRecord(d-1)
    + '<p class="small muted">To play the next day now, turn on Play ahead under Files.</p></div>'
    + mapCard(d-1)
    + earlierDays(d-1);
}

  let callTotal = 0, evTotal = 0;
  const rows = [];
  for (let d = 1; d <= C.days; d++){

    rows.push({d, sc, b:S.briefs[d]});
  }
  const dTotal = doubtPoints();
  const bTotal = burnPoints();
  const xTotal = eventPts();
  const total = callTotal + evTotal + dTotal + bTotal + xTotal + ending.points;
  const seen = seenReports();
  const planted = seen.filter(r => r.kind === 'planted');
  const caught = planted.filter(r => (S.grades[r.id] || {}).f).length;
  const falseAlarms = seen.filter(r => r.kind === 'true' && (S.grades[r.id] || {}).f).length;
  const clutter = seen.filter(r => r.kind === 'clutter');

    + '<div class="score"><span class="n">' + sign(total) + '</span><span class="mono small muted">calls ' + sign(callTotal) + ' · evidence ' + sign(evTotal) + ' · doubts ' + sign(dTotal) + (bTotal ? ' · burned sources ' + sign(bTotal) : '') + (S.eventPoints || []).map(x => ' · ' + esc(x.label) + ' ' + sign(x.points)).join('') + ' · ending ' + sign(ending.points) + '</span></div>'
    + (S.eventPoints || []).filter(x => x.title).map(x => '<p class="small"><b>' + esc(cap(x.label)) + ':</b> ' + esc(x.title) + ' (' + sign(x.points) + ')</p>').join('')
    + '<div class="tablewrap"><table><thead><tr><th>Day</th><th>Your call</th><th>Truth</th><th class="num">Call</th><th class="num">Evid.</th><th class="num">Min</th></tr></thead><tbody>'
    + rows.map(x => '<tr><td class="mono">' + x.d + '</td><td><span class="' + (x.sc.right ? 'right' : 'wrong') + '">' + x.b.hyp + '</span> ' + confLabel(x.b.conf) + '' + '</td><td>' + x.sc.truth.trueHypothesis + '</td><td class="num">' + sign(x.sc.call) + '</td><td class="num">' + sign(x.sc.ev) + '</td><td class="num">' + x.b.minutes + '</td></tr>').join('')
    + '</tbody></table></div>'

    + credCard()
    + postingNotice()
    + (S.offRecord && REC.runs[C.id] ? '<p class="small muted">This run is off the record. Your first finish stands: ' + esc(REC.runs[C.id].endingTitle) + '.</p>' : '<p class="small muted">This finish is on your service record.</p>')
    + (CFG.playtest ? debriefCard() : '')
    + '<div class="btnrow"><button class="btn ghost" data-act="copylog">Copy playtest log</button></div>'
    + (!C.map ? '' : '<div class="stack"><div class="section-h"><h3>What was really there</h3></div>'
    + '<div class="daypick" role="group" aria-label="Day">' + Array.from({length:C.days}, (_, k) => k + 1).map(x => '<button data-act="pmday" data-v="' + x + '" aria-pressed="' + (pd === x) + '">Day ' + x + '</button>').join('') + '</div>'
    + '<figure class="map" style="margin:0">' + mapSVG({onlyDay:pd, today:pd, truthDay:pd, asset:assetOnDay(pd)})
    + '<figcaption class="mapcap" id="mapcap">' + esc((M0().truthNote || ('Red diamonds are where ' + ADV() + '\'s units really were on Day {day}.')).replace('{day}', pd)) + ' Pins are that day\'s reporting. ' + (ui.pin && rep(ui.pin).day === pd ? mapCaption() : 'Tap a pin for its item.') + '</figcaption></figure></div>');

  for (let d = 1; d <= C.days; d++){
    const t = C.groundTruth.find(g => g.day === d);
    const b = S.briefs[d];
    const script = C.postmortem.script.find(s => s.days[0] === d);
    html += '<details' + (d === 1 ? ' open' : '') + '><summary><span>Day ' + d + ' · truth ' + t.trueHypothesis + '</span><span class="mono small muted">' + (b ? 'you: ' + b.hyp + ' ' + confLabel(b.conf) : '') + '</span></summary><div class="inner">'
      + (script ? '<p>' + esc(script.text) + '</p>' : '')
      + (b ? '<p class="kj">' + esc(keyJudgment(b)) + '</p>' : '')
      + '<p class="small"><span class="muted">What was happening:</span> ' + esc(t.state) + '</p>'
      + '<p class="small"><span class="muted">Best call:</span> ' + esc(t.bestCall) + '</p>'
      + (COLL() ? '<p class="small"><span class="muted">Your tasking:</span> ' + (b && b.tasks && b.tasks.length ? b.tasks.map(x => esc(x.disc + ' · ' + targetById(x.target).name)).join('; ') : 'none') + '</p>' : '')
      + (C.postmortem.missedCollection && C.postmortem.missedCollection[d] ? '<p class="small"><span class="muted">The collection that mattered:</span> ' + esc(C.postmortem.missedCollection[d]) + '</p>' : '')
      + reportsFor(d).map(r => revealItem(r, b)).join('')
      + '</div></details>';
  }
  Object.keys(S.burned || {}).forEach(k => {
    const rule = ((COLL() || {}).burnRules || []).find(b => b.sourceId === k);
    html += '<div class="reveal"><div class="head"><b>' + esc((C.sources.find(x => x.id === k) || {codeName:k}).codeName) + '</b><span class="pill k-planted">Source burned</span><span class="missed">' + (COLL().burnPoints || 0) + '</span></div><p class="what">' + esc(rule ? rule.postmortem : '') + '</p></div>';
  });
  if (boardIds().length){
    const last = C.groundTruth.find(g => g.day === C.days);
    html += '<div class="stack"><div class="section-h"><h3>Your board</h3></div>' + boardView(C.days, true)
      + '<p class="small muted">Truth on the last day: <b>' + last.trueHypothesis + '</b>. A planted item you didn\'t doubt counts on your board exactly as ' + esc(ADV()) + ' intended.</p></div>';
  }
  if (C.postmortem.openQuestion) html += '<div class="msg"><span class="from">An open question</span><p>' + esc(C.postmortem.openQuestion) + '</p>' + (REC.runs[C.id] && !S.offRecord ? '<p class="small muted">Added to your case file.</p>' : '') + '</div>';
  html += analystsCard();
  html += '<div class="stack"><h3>Lessons</h3><ul>' + C.postmortem.lessons.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div>'
    + '<div class="stack"><h3>Your sources, revealed</h3>' + C.sources.filter(s => !s.rosterHidden).map(s => '<p class="small"><span class="mono"><b>' + esc(s.codeName) + '</b></span> ' + (s.controlledByAdversary === true ? '<span class="pill k-planted">Adversary channel</span> ' : '') + esc(s.postmortemNote || '') + '</p>').join('') + '</div>'
    + '<div class="btnrow"><button class="btn" data-act="restart">Play again</button></div>';
  return html;
}

function credCard(){
  if (!CRED() || typeof S.credFinal !== 'number') return '';
  const lab = v => credLevel(v).label + ' (' + v + ')';
  const lines = (S.credLog || []).filter(x => x.id !== 'outcome').map(x => '<li>After your Day ' + (x.day - 1) + ' brief: ' + esc(x.note) + '</li>');
  const out = (S.credLog || []).find(x => x.id === 'outcome');
  return '<div class="msg"><span class="from">Credibility with ' + esc(C.customer.name) + ' · not scored</span>'
    + '<p class="credline">Credibility: ' + lab(S.credStart) + ' → ' + lab(S.credEnd) + ' → ' + lab(S.credFinal) + ' after the outcome</p>'
    + (lines.length ? '<ul class="small">' + lines.join('') + '</ul>' : '<p class="small">Nothing ' + PRON()[0] + ' had to undo, and no run of Low calls.</p>')
    + '<p class="small muted">The outcome ' + (out ? (out.delta > 0 ? 'added ' : 'cost ') + Math.abs(out.delta) : 'changed nothing') + '. From Phase 3, credibility carries into your next crisis.</p></div>';
}
function epilogue(){ const E = C.epilogue; const t = E ? (E.texts || {})[(S.flags || {})[E.event]] : ''; return t ? ' ' + t : ''; }
function totalScore(){
  let t = (C.endings.find(e => e.id === S.ending) || evalEnding()).points + doubtPoints() + burnPoints() + eventPts();
  for (let d = 1; d <= C.days; d++) if (S.briefs[d]){ const sc = scoreDay(d); t += sc.call + sc.ev; }

}
function assetOnDay(d){ return (S.posture && S.posture[d]) || 'home'; }

function revealItem(r, brief){
  const g = S.grades[r.id] || {};
  const cited = brief && brief.evidence.includes(r.id);
  let mark = '';
  if (r.kind === 'planted') mark = g.f ? '<span class="caught">Doubted +' + C.scoring.challenge.planted + '</span>' : '<span class="missed">Not doubted</span>';
  else if (r.kind === 'true' && g.f) mark = '<span class="missed">Doubted a true item ' + C.scoring.challenge.true + '</span>';
  else if (r.kind === 'clutter' && g.n) mark = '<span class="caught">Marked not relevant</span>';
  const tells = (r.tells || []).map(t => C.tellLabels[t] || t);
  return '<div class="reveal"><div class="head"><b>' + r.id + '</b><span>' + esc(src(r.sourceId).codeName) + '</span><span class="pill k-' + r.kind + '">' + KIND_LABEL[r.kind] + '</span>' + (r.diagnostic ? '<span class="pill k-true">Diagnostic</span>' : '') + (cited ? '<span class="pill">Cited ' + ((C.scoring.evidence[r.kind] > 0 ? '+' : '') + C.scoring.evidence[r.kind]) + '</span>' : '') + mark + '</div>'
    + '<p class="txt">' + esc(r.text) + '</p>'
    + (r.reveal
      ? '<div class="why"><p><span class="whyk">What gave it away</span>' + esc(r.reveal.tell) + '</p>'
        + '<p><span class="whyk">Check it against ' + r.reveal.crossCheck.ids.join(', ') + '</span>' + esc(r.reveal.crossCheck.text) + '</p>'
        + '<p><span class="whyk">Why ' + esc(ADV()) + ' planted it</span>' + esc(r.reveal.motive) + '</p></div>'
      : '<p class="what">' + esc(r.postmortemNote) + '</p>')
    + (tells.length ? '<p class="tells">Tells: ' + tells.map(esc).join(' · ') + '</p>' : '')
    + '<p class="yourgrade">' + gradeSummary(g) + '</p></div>';
}

function playtestLog(){
  const ending = C.endings.find(e => e.id === S.ending) || evalEnding();
  const lines = ['Crisis ' + C.crisisNumber + ' (' + C.title + ') playtest log', 'Day | Min | Call | Confidence | Truth | Call pts | Evidence | Evid pts | ' + CUST() + ' | Tasked | Board | Cred'];
  let total = ending.points;
  for (let d = 1; d <= C.days; d++){
    const b = S.briefs[d]; if (!b) continue;
    const sc = scoreDay(d); total += sc.call + sc.ev;
    lines.push([d, b.minutes, b.hyp, confLabel(b.conf) + (b.confLost ? ' (lost on reload, guessed)' : ''), sc.truth.trueHypothesis, sc.call, b.evidence.join(' ') || '-', sc.ev, b.reply, (b.tasks || []).map(x => x.disc + ':' + x.target).join(' ') || '-',
      b.board ? (b.board.lead ? b.board.lead.join('/') + ' least contradicted' : 'no lead') + ', ' + b.board.pins + ' pinned' : '-',
      b.cred == null ? '-' : b.cred + (b.actedAs ? ' (acted as ' + b.actedAs + ')' : '')].join(' | '));
  }
  const seenAll = seenReports();
  const planted = seenAll.filter(r => r.kind === 'planted');
  const dp = doubtPoints(); total += dp;
  const bp = burnPoints(); total += bp;
  (S.eventPoints || []).forEach(x => { total += x.points; lines.push(x.label + ': ' + x.points); });
  if (bp) lines.push('Burned sources: ' + Object.keys(S.burned).join(' ') + ' (' + bp + ')');
  lines.push('Doubts: ' + dp);
  if (CRED()) lines.push('Credibility: start ' + S.credStart + (S.credLog || []).map(x => ', ' + x.id + ' ' + (x.delta > 0 ? '+' : '') + x.delta).join('') + ' -> ' + (typeof S.credFinal === 'number' ? S.credFinal : S.cred));
  const bIds = boardIds();
  lines.push('Board: ' + (bIds.length ? bIds.length + ' pinned, ' + bIds.filter(id => Object.keys(S.board[id].m).length).length + ' marked (' + bIds.map(id => id + ' ' + C.hypotheses.map(h => S.board[id].m[h.id] || '.').join('')).join(', ') + ')' : 'not used'));
  if (S.done) lines.push('Ending: ' + ending.title + ' [' + ending.id + '] (' + ending.points + ')', 'Total: ' + total);
  else lines.push('In progress: ' + Object.keys(S.briefs).length + ' of ' + C.days + ' briefs sent');
  lines.push(
    'Planted doubted: ' + planted.filter(r => (S.grades[r.id] || {}).f).length + '/' + planted.length + ' (' + planted.filter(r => (S.grades[r.id] || {}).f).map(r => r.id).join(' ') + ')',
    'True items doubted: ' + seenAll.filter(r => r.kind === 'true' && (S.grades[r.id] || {}).f).map(r => r.id).join(' '));
  for (let d = 1; d <= C.days; d++){
    const f = S.feedback[d];
    if (f && (f.r || f.note)) lines.push('Day ' + d + ' reaction: ' + (f.r || '-') + (f.note ? ' | ' + f.note : ''));
  }
  Object.keys(S.realism || {}).forEach(id => lines.push('Realism flag ' + id + (S.realism[id].note ? ': ' + S.realism[id].note : '')));
  const db0 = S.debrief || {};
  if (Object.keys(db0).length) lines.push('Debrief: ' + DEBRIEF.map(q => q.id + '=' + (db0[q.id] || '-')).join(', ') + (db0.note ? ' | ' + db0.note : ''));
  return lines.join('\n');
}

async function loadPlaytests(){
  if (!DB || ui.pt.loading) return;
  ui.pt.loading = true; ui.pt.err = ''; render();
  try {
    const snap = await Promise.race([DB.collection('playtests').get(), new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000))]);
    ui.pt.docs = snap.docs.map(x => Object.assign({id:x.id}, clone(x.data() || {}))).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    try {
      const ps = await USER.profiles(ui.pt.docs.map(x => x.id));
      ui.pt.names = {}; ui.pt.docs.forEach(x => { ui.pt.names[x.id] = (ps && ps[x.id] && ps[x.id].name) || ''; });
    } catch(e) {}
    ui.pt.loaded = true;
  } catch(e) { ui.pt.err = 'Couldn\'t load playtest results. Try again in a moment.'; }
  ui.pt.loading = false; render();
}

      + '<div class="btnrow"><button class="btn ghost" data-act="ptcopy" data-i="' + i + '">Copy log</button></div></div></details>';
  });
