      const p = progFromState(st0);
      if (await maybeRecord(x, st0)) changed = true, carryChanged();
      if (p && (!PROG[x.id] || p.savedAt > PROG[x.id].savedAt)){ PROG[x.id] = p; changed = true; }
    } catch(e) {}
  }));
  if (changed && ui.screen !== 'game') render();
}
function progress(id){ return (CUR && CUR.id === id && S) ? progFromState(S) : (PROG[id] || {started:false, done:false, day:1}); }
function crisisUnlocked(id){
  const i = INDEX.findIndex(x => x.id === id);
  return i <= 0 || !!CFG.unlockAll || !!progress(INDEX[i-1].id).cleared;
}
function crisisStatus(x){
  if (!crisisUnlocked(x.id)){ const prev = INDEX[INDEX.findIndex(k => k.id === x.id) - 1]; return 'Finish ' + (prev.title || 'the scenario before it') + ' to unlock.'; }
  const p = progress(x.id);
  if (p.done) return 'Finished' + (p.summary ? ' · ' + p.summary.title + ' · ' + (p.summary.total > 0 ? '+' : '') + p.summary.total : '') + '. Open the postmortem or play again.';
  if (p.started) return 'In progress · Day ' + p.day;
  return p.cleared ? 'Finished before. Starting over.' : 'Not started';
}
async function openCrisis(id){
  if (!crisisUnlocked(id)){ toast('Locked. Finish the scenario before it first.'); return; }
  if (CUR && CUR.id === id){ ui.screen = 'game'; if (ui.tab === 'playtests') ui.tab = 'inbox'; render(); window.scrollTo(0, 0); return; }
  await switchCrisis(id);
}
function menuView(){
  const next = INDEX.find(x => crisisUnlocked(x.id) && !progress(x.id).cleared) || CUR;
  const p = progress(next.id);
  const label = (p.done ? 'Review' : p.started ? 'Continue' : 'Start') + ' · ' + (next.title || C.title);
  const sub = p.done ? 'Finished' : p.started ? 'Scenario ' + (next.number || '') + ' · Day ' + p.day : 'Scenario ' + (next.number || '');
  return '<header class="top menu-top"><span class="eyebrow">Intel cell sim</span><h1 class="gametitle">Low Confidence</h1>'
    + '<p class="muted">Read the reporting. Doubt what deserves it. Tell the customer what you think, and how sure you are.</p></header>'
    + '<main class="stack menu">'
    + '<button class="btn big" data-act="crisis" data-id="' + esc(next.id) + '">' + esc(label) + '<small>' + esc(sub) + '</small></button>'
    + '<button class="btn ghost big" data-act="list">Scenarios<small>' + INDEX.filter(x => progress(x.id).cleared).length + ' of ' + INDEX.length + ' finished</small></button>'
    + '<button class="btn ghost big" data-act="record">Service record<small>' + (Object.keys(REC.runs).length ? Object.keys(REC.runs).length + ' on the record' : 'Nothing on the record yet') + '</small></button>'
    + (caseEntries().total ? '<button class="btn ghost big" data-act="case">Case file<small>' + caseEntries().noticed + ' noted · ' + caseEntries().total + ' open question' + (caseEntries().total > 1 ? 's' : '') + '</small></button>' : '')
    + (CFG.playtest && ui.isOwner ? '<button class="btn ghost big" data-act="tab" data-v="playtests">Tester results</button>' : '')
    + (CFG.playtest ? '<p class="small muted">Playtest build. Your results are recorded automatically.</p>' : '')
    + '<p class="small muted">' + esc(saveStatusText()) + '</p>'
    + '</main>';
}
function listView(){
  return '<header class="top"><button class="linkbtn menulink" data-act="menu">‹ Menu</button><h1>Scenarios</h1>'
    + '<p class="muted small">Finish a scenario to unlock the next. Unlocked scenarios can be played in any order, and each keeps its own progress.</p></header>'
    + '<main class="stack">'
    + INDEX.map(x => {
        const open = crisisUnlocked(x.id);
        return '<button class="opt scen' + (open ? '' : ' locked') + '" data-act="crisis" data-id="' + esc(x.id) + '" aria-disabled="' + !open + '"><span class="k">' + esc(x.number || '') + '</span><span class="t">' + (open ? esc(x.title || x.id) : 'Locked') + '</span>'
          + '<span class="d">' + (open ? esc(x.line || '') + '<br>' : '') + '<b>' + esc(crisisStatus(x)) + '</b></span></button>';
      }).join('')
    + '</main>';
}

async function start(hotData){
  try {
    const cr = await fetch(CONFIG_URL, {cache:'no-cache'});
    if (cr.ok){ const cfg = await cr.json(); if (cfg && typeof cfg.playtest === 'boolean') CFG = Object.assign(CFG, cfg); }
  } catch(e) { /* no config: normal build */ }
  try {
    const ir = await fetch(INDEX_URL, {cache:'no-cache'});
    if (ir.ok){ const ix = await ir.json(); if (Array.isArray(ix) && ix.length) INDEX = ix; }
  } catch(e) { /* no index: single crisis */ }
  if (!INDEX.length) INDEX = [{id:'border-buildup', file:CRISIS_URL}];
  let want = null; try { want = localStorage.getItem(LS_PREFIX + 'current'); } catch(e) {}
  if (hotData && hotData.crisis) want = hotData.crisis;
  loadProgress(); loadRecord();
  CUR = INDEX.find(x => x.id === want && crisisUnlocked(x.id)) || INDEX[0];
  try {
    const res = await fetch(CUR.file, {cache:'no-cache'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    C = await res.json();
  } catch(e) {
    app.innerHTML = '<p class="loading">Couldn\'t load the crisis file (' + esc(CUR.file) + '). Reload the page to try again.</p>';
    return;
  }
  S = normalize(hotData && hotData.S) || normalize(loadLocal()) || fresh();
  if (S.done && !S.offRecord) commitRecord();
  if (S.done && REC.runs[C.id] && !REC.runs[C.id].story && REC.runs[C.id].runKey === runKey(C, S)){ REC.runs[C.id].story = storyFrom(C, S); REC.runs[C.id].flags = clone(S.flags || {}); REC.runs[C.id].openQuestion = (C.postmortem || {}).openQuestion || ''; saveRecord(); }
  ensureRecords();
  ui.pmDay = C.days; ui.pin = null; ui.sheet = null;
  ui.tab = (hotData && hotData.tab) || 'inbox';
  if (hotData && hotData.screen) ui.screen = hotData.screen;
  render();
  connectAccount();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({S:S, tab:ui.tab, screen:ui.screen, crisis:CUR && CUR.id}));
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
